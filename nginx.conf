worker_processes 1;

events {
    worker_connections 1024;
}

http {
    map $request_method $post_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    # Trust proxy IP range (zeabur)
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;

    # 1 per 4s == 15r/m.
    limit_req_zone $post_limit_key zone=post_per_sec:10m rate=15r/m;
    limit_req_zone $post_limit_key zone=post_per_min:10m rate=8r/m;

    server {
        listen 8080;
        server_name _;

        location / {
            limit_req zone=post_per_sec;
            limit_req zone=post_per_min;

            client_max_body_size 5m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 400 = @plain_400;
        error_page 401 = @plain_401;
        error_page 403 = @plain_403;
        error_page 404 = @plain_404;
        error_page 405 = @plain_405;
        error_page 408 = @plain_408;
        error_page 413 = @plain_413;
        error_page 429 = @plain_429;
        error_page 500 = @plain_500;
        error_page 502 = @plain_502;
        error_page 503 = @plain_503;
        error_page 504 = @plain_504;

        location @plain_400 {
            internal;
            default_type text/plain;
            return 400 "400 Bad Request\n";
        }

        location @plain_401 {
            internal;
            default_type text/plain;
            return 401 "401 Unauthorized\n";
        }

        location @plain_403 {
            internal;
            default_type text/plain;
            return 403 "403 Forbidden\n";
        }

        location @plain_404 {
            internal;
            default_type text/plain;
            return 404 "404 Not Found\n";
        }

        location @plain_405 {
            internal;
            default_type text/plain;
            return 405 "405 Method Not Allowed\n";
        }

        location @plain_408 {
            internal;
            default_type text/plain;
            return 408 "408 Request Timeout\n";
        }

        location @plain_413 {
            internal;
            default_type text/plain;
            return 413 "413 Payload Too Large\n";
        }

        location @plain_429 {
            internal;
            default_type text/plain;
            return 429 "429 Too Many Requests\n";
        }

        location @plain_500 {
            internal;
            default_type text/plain;
            return 500 "500 Internal Server Error\n";
        }

        location @plain_502 {
            internal;
            default_type text/plain;
            return 502 "502 Bad Gateway\n";
        }

        location @plain_503 {
            internal;
            default_type text/plain;
            return 503 "503 Service Unavailable\n";
        }

        location @plain_504 {
            internal;
            default_type text/plain;
            return 504 "504 Gateway Timeout\n";
        }
    }
}
